<!doctype html>
<html lang="ru"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Демо сайтов</title>
<style>
:root{--bg:#dfe3e8;--ink:#15181c;--mute:#5f6873;--card:#fff;--acc:#2b59c3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Arial,sans-serif}
.wrap{display:flex;gap:40px;align-items:flex-start;justify-content:center;padding:32px 24px;min-height:100vh}
.side{width:300px;flex:none}
h1{font-size:26px;margin-bottom:4px}.side p{color:var(--mute);font-size:14px;margin-bottom:18px}
.list a{display:block;padding:12px 14px;margin-bottom:8px;border-radius:12px;background:var(--card);text-decoration:none;color:inherit;border:2px solid transparent}
.list a b{display:block}.list a span{font-size:13px;color:var(--mute)}
.list a.on{border-color:var(--acc)}
.phone{flex:none;width:414px;height:868px;border-radius:52px;background:#111;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.25);position:sticky;top:24px}
.phone iframe{width:390px;height:844px;border:0;border-radius:40px;background:#fff;display:block}
.open{display:inline-block;margin-top:10px;font-size:14px;color:var(--acc)}
@media (max-width:820px),(max-height:700px){.phone{display:none}.wrap{display:block;padding:20px 16px}.side{width:auto}}
</style></head><body>
<div class="wrap">
  <div class="side">
    <h1>Демо сайтов</h1>
    <p>На ноутбуке сайт показан в рамке телефона, ровно как его увидит клиент. С телефона ссылка открывает сайт сразу.</p>
    <div class="list" id="list"></div>
    <a class="open" id="open" target="_blank">Открыть выбранный на весь экран</a>
  </div>
  <div class="phone"><iframe id="fr" title="Сайт на телефоне"></iframe></div>
</div>
<script>
const S=[ ["Посёлок — образец","Северный берег","коттеджный посёлок у озера: генплан, дом, запись на просмотр"],["Кофейня — образец","Кофейня (образец)","заказы без агрегатора, корзина, предзаказ"],
 ["TonOneLove","TonOneLove","тонировка: плёнка наезжает на стекло"],
 ["F41 барбершоп","F41","барбершоп: выбор мастера и цены"],
 ["Uni салон","Uni","салон: заезд камеры в зал"],
 ["Master Omer барбершоп","Master Omer","барбершоп: табло свободных кресел"],
 ["Nata permanent","Nata","перманент: карта лица"],
 ["Optimus детейлинг","Optimus","детейлинг: светишь лампой по салону"],
 ["Шиномонтаж Шаумяна","Шиномонтаж","крутишь колесо — видишь цену"],
 ["New Order тату","New Order","тату: отрываешь сертификат"],
 ["Harlem park детейлинг","Harlem park","детейлинг: запись и цены"],
 ["Урал-М автокомплекс","Урал-М","мойка и шиномонтаж: табло свободных постов"],
 ["PRIMAVERA салон","PRIMAVERA","салон красоты на Бардина: запись и цены"],
 ["Автопремиум автомойка","Автопремиум","мойка на Чкалова: 10 тарифов и шиномонтаж"],
 ["ICE TEAM автомойка","ICE TEAM","мойка в центре: запись без очереди"],
 ["Абв шиномонтаж","Абв","шиномонтаж на Эльмаше: запись и цены"]];
const wide=()=>getComputedStyle(document.querySelector(".phone")).display!=="none";
const L=document.getElementById("list"),F=document.getElementById("fr"),O=document.getElementById("open");
L.innerHTML=S.map(s=>`<a href="${encodeURI(s[0])}/index.html"><b>${s[1]}</b><span>${s[2]}</span></a>`).join("");
function pick(a){L.querySelectorAll("a").forEach(x=>x.classList.toggle("on",x===a));F.src=a.getAttribute("href");O.href=a.getAttribute("href")}
L.querySelectorAll("a").forEach(a=>a.onclick=e=>{if(wide()){e.preventDefault();pick(a)}});
pick(L.querySelector("a"));
const P=document.querySelector(".phone");function fit(){const k=Math.min(1,(innerHeight-48)/868);P.style.transform="scale("+k+")";P.style.transformOrigin="top center";P.style.marginBottom=(868*(k-1))+"px"}
addEventListener("resize",fit);fit();
</script></body></html>
